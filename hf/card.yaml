type: kernel
repo_id: SZLHOLDINGS/YARQA-ATTN
title: YARQA-ATTN
summary: >-
  KERNEL kernel card. Original SZL **compartment / plug-flow** attention cut:
  partition a sequence into canals (contiguous compartments), attend within each
  canal, and emit SHA3-256 receipts of the partition and of the attention output.
  Receipt-aware. Honesty-labeled. SOFTWARE/KERNEL: not a trained model, no weights.
